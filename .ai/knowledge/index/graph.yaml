  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a fast profile of a file with more than 100,000 rows, then its metrics are labelled "first
    100,000 rows, not random", and no total row count is claimed.
