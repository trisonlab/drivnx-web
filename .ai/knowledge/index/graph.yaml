  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: 'Given any metric, then the screen shows its scope (whole file or first rows), its precision (exact
    or approximate) and its run''s time and ID, and results from different scopes are never mixed without '
