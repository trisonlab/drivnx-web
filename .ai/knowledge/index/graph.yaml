- id: criterion:CFX-APP-csv-profile/AC-02
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a file read with the wrong delimiter, header setting, encoding or skipped lines, when the
    user saves the right value, then the columns and the preview show the file read that way, and restarting
- id: criterion:CFX-APP-csv-profile/AC-03
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given settings that can't read the file, or an encoding over the 100 MB limit, when the user saves,
    then they get a clear message and the previous settings stay in use.
- id: criterion:CFX-APP-csv-profile/AC-04
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a correction that changes the column names, then every earlier name for that source is replaced
    with a generated name, and a raw scan of `workspace.db` and its WAL file no longer finds the old n
- id: criterion:CFX-APP-csv-profile/AC-05
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a path already connected with corrected settings, when it is connected again, then the existing
    source opens with the corrected settings.
- id: criterion:CFX-APP-csv-profile/AC-06
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a profile run in progress, when the user tries to save a correction, then it is refused
    with a clear message.
- id: criterion:CFX-APP-csv-profile/AC-07
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a connected CSV and no run in progress, when the user chooses Fast profile, then a run reads
    at most the first 100,000 rows and completes with its results shown.
- id: criterion:CFX-APP-csv-profile/AC-08
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a connected CSV, when the user chooses Full profile, then a run reads every row and completes
    with exact results and the file's row count.
- id: criterion:CFX-APP-csv-profile/AC-09
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a run in progress, then the header's profile status and the Profile tab show that it's running,
    and a second run is refused with a clear message.
- id: criterion:CFX-APP-csv-profile/AC-10
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a run in progress, when the user cancels it, then it stops within the target under Non-functional,
    its status is `cancelled`, and no results or findings from it appear as current.
- id: criterion:CFX-APP-csv-profile/AC-11
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: 'Given a file that has moved, was deleted or can''t be read, when a run starts or fails partway,
