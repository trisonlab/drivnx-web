    as '
- id: criterion:CFX-APP-csv-profile/AC-12
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a file whose columns no longer match the saved ones, when a run starts, then it is refused
    with a message pointing to the source's settings, and saving those settings reads the columns again.
- id: criterion:CFX-APP-csv-profile/AC-13
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
  text: Given a profile job, then it creates nothing in the current directory, and any spill files are
    inside `<workspace>/duckdb-tmp/`.
- id: criterion:CFX-APP-csv-profile/AC-14
  kind: criterion
  evidence:
  - .ai/knowledge/requirements/CFX-APP-csv-profile.md
