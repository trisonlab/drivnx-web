# [DEBUG-5b9d] throwaway probe on a do-not-merge branch, beside the full CI: captures macOS's raw
# error text for a dropped plain-TCP connection mid-read.
name: Debug probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DRIVNX_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run --frozen python tests/postgres_fixture.py start
      - run: uv run --frozen pytest tests/integration/test_zz_debug_5b9d_probe.py -s -q
