# Each check here is also a documented local command in the README (CFX-APP-first-slice/AC-53).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: pnpm --dir apps/web install --frozen-lockfile
      # Playwright's --with-deps runs apt-get; retry downloads so a short Ubuntu mirror outage doesn't fail the job.
      - if: runner.os == 'Linux'
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest tests/integration tests/golden
      - run: uv run --frozen pytest tests/e2e
      - run: pnpm --dir apps/web test

  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: git ls-files -z | xargs -0 uvx --from detect-secrets@1.5.0 detect-secrets-hook --exclude-files '\.ai/hooks/secret-scan/hook\.py|\.ai/lock\.yaml|pnpm-lock\.yaml|uv\.lock|\.ai/knowledge/index/'
        shell: bash
      - run: uv export --frozen --no-emit-project --no-hashes --no-header --no-annotate | uvx pip-audit==2.10.1 --disable-pip --no-deps -r /dev/stdin
        shell: bash
      - run: pnpm --dir apps/web audit
