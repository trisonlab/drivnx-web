[project]
name = "drivnx-data"
version = "0.0.0"
description = "Local runtime and browser UI that turn unfamiliar data into evidence-backed understanding."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "duckdb==2.0.0",
    "fastapi>=0.162.0",
    "fsspec>=2026.9.0",
    "pydantic>=2.14.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
drivnx = "local_api.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/local-api/local_api", "packages/artifacts", "packages/connectors", "packages/domain", "packages/profiling"]
# The UI bundle is git-ignored, so it must be named here to reach the wheel.
# So is DuckDB's PostgreSQL extension, fetched by the build (ADR 0006).
artifacts = ["apps/local-api/local_api/ui/**", "packages/connectors/postgres_extension/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only failed tests keep their temporary folders. A full run builds and installs wheels of about
# 157 MB each, and a RAM-disk /tmp filled up keeping three runs (DRIVN-46 review).
tmp_path_retention_policy = "failed"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]
