[project]
name = "conflux-data"
version = "0.0.0"
description = "Local runtime and browser UI that turn unfamiliar data into evidence-backed understanding."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
conflux = "local_api.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/local-api/local_api"]
# The UI bundle is git-ignored, so it must be named here to reach the wheel.
artifacts = ["apps/local-api/local_api/ui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
