# Who the PostgreSQL fixture signs in (CFX-APP-postgres AC-34): every account with its password.
# drivnx_plain is refused over TLS, so "prefer" falls back to a connection that isn't encrypted,
# and "require" fails, against a server that has TLS (DRIVN-47).
hostssl all drivnx_plain all reject
local   all all     scram-sha-256
host    all all all scram-sha-256
